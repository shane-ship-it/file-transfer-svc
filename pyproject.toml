[tool.poetry]
name = "cloud-storage-transfer"
version = "0.1.0"
description = "A flexible cloud storage transfer service for downloading files from Azure Blob Storage and other providers"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/yourusername/cloud-storage-transfer"
repository = "https://github.com/yourusername/cloud-storage-transfer"
keywords = ["azure", "blob", "storage", "transfer", "download", "cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
azure-storage-blob = "^12.19.0"
azure-core = "^1.29.5"
click = "^8.1.7"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"

# Optional dependencies for different features
google-cloud-storage = {version = "^2.10.0", optional = true}
fastapi = {version = "^0.104.1", optional = true}
uvicorn = {version = "^0.24.0", optional = true}
pydantic = {version = "^2.5.0", optional = true}

[tool.poetry.extras]
gcp = ["google-cloud-storage"]
api = ["fastapi", "uvicorn", "pydantic"]
all = ["google-cloud-storage", "fastapi", "uvicorn", "pydantic"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"
isort = "^5.12.0"
pre-commit = "^3.5.0"
types-pyyaml = "^6.0.12"

[tool.poetry.scripts]
blob-transfer = "src.cli:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
    "pass",
]